name: deploy-backend-to-render

# Push to main -> builds + pushes the PROD backend image to GHCR.
# Path-filtered so frontend-only changes don't redeploy the backend.
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/deploy-backend-to-render.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-backend-to-render-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (backend + workspace deps)
        run: pnpm install --frozen-lockfile --filter backend...

      - name: Run unit tests
        run: pnpm --filter backend test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production-backend
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ambitiousyou-backend
      # Supabase can resolve to IPv6 first; GitHub-hosted runners may not have
      # IPv6 egress. Force Node DNS to prefer IPv4 for pg/drizzle connectivity.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Full graph install so drizzle-kit (a devDependency) is available.
      - name: Install (backend + workspace deps)
        run: pnpm install --frozen-lockfile --filter backend...

      - name: Verify DB connectivity
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_POOLER_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          node -e "const v=process.env.DATABASE_URL||''; if(v!==v.trim())console.log('WARNING: DATABASE_URL has leading/trailing whitespace (len '+v.length+' vs trimmed '+v.trim().length+')'); try{const u=new URL(v.trim()); console.log('Target -> host='+u.hostname+' port='+(u.port||'5432')+' user='+decodeURIComponent(u.username)+' params='+(u.search||'(none)'));}catch(e){console.log('URL parse error: '+e.message+' (password may contain unescaped special characters)');}"
          node -e "const {Client}=require('pg'); const c=new Client({connectionString:process.env.DATABASE_URL, connectionTimeoutMillis:10000}); c.connect().then(()=>c.query('select 1')).then(()=>{console.log('DB connection OK');return c.end();}).then(()=>process.exit(0)).catch(e=>{console.error('DB connection FAILED:', e.message);process.exit(1);});"

      # Apply migrations to Supabase BEFORE deploying new app code.
      - name: Run DB migrations
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_POOLER_DATABASE_URL || secrets.DATABASE_URL }}
        run: pnpm exec drizzle-kit migrate

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        env:
          # Read from the Production environment secret used in this repo.
          PROD_HOOK: ${{ secrets.RENDER_BACKEND_PROD_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$PROD_HOOK" ]; then
            echo "Missing RENDER_BACKEND_PROD_DEPLOY_HOOK_URL in environment: production-backend."
            exit 1
          fi

          IMAGE_URL="${IMAGE}:${GITHUB_SHA}"
          ENCODED_IMAGE_URL="$(node -p "encodeURIComponent(process.argv[1])" "$IMAGE_URL")"
          QUERY_JOINER='?'
          if [[ "$PROD_HOOK" == *\?* ]]; then
            QUERY_JOINER='&'
          fi
          DEPLOY_URL="${PROD_HOOK}${QUERY_JOINER}imgURL=${ENCODED_IMAGE_URL}"

          curl --silent --show-error --fail --request POST "$DEPLOY_URL"
          echo "Render production deploy triggered for $IMAGE_URL."
