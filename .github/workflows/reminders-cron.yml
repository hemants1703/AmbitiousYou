name: reminders-cron

# Global 9 AM / 6 PM local delivery requires an hourly UTC tick: at every UTC hour,
# at least one IANA timezone is at local 09:00 or 18:00. Nest reads each user's
# user_timezone and only sends when their local hour is exactly 9 (morning) or
# 18 (evening). Evening is skipped automatically once the move is completed.
on:
  schedule:
    - cron: '0 * * * *' # top of every hour UTC → covers all local 09:00 / 18:00 slots
  workflow_dispatch: {}

concurrency:
  group: reminders-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: production due-today reminders
    runs-on: ubuntu-latest
    environment: production-backend
    steps:
      - name: Trigger reminders sweep
        env:
          API_URL: ${{ secrets.REMINDERS_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "REMINDERS_API_URL and CRON_SECRET must be set on the production-backend environment."
            exit 1
          fi
          # Trim trailing slash from base URL
          BASE_URL="${API_URL%/}"
          echo "POST ${BASE_URL}/internal/reminders/run"
          curl -fsS -X POST "${BASE_URL}/internal/reminders/run" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w "\nHTTP %{http_code}\n"
