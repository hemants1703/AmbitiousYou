name: deploy-backend-to-vps

# Push to dev -> deploys the DEV backend (api.dev.ambitiousyou.pro, Supabase dev)
# Push to main -> deploys the PROD backend (api.ambitiousyou.pro, Supabase prod)
# Path-filtered so frontend-only changes don't redeploy the backend.
on:
  # push:
  #   branches: [main, dev]
  #   paths:
  #     - 'apps/backend/**'
  #     - 'packages/shared/**'
  #     - '.github/workflows/deploy-backend-to-vps.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (backend + workspace deps)
        run: pnpm install --frozen-lockfile --filter backend...

      - name: Run unit tests
        run: pnpm --filter backend test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # GitHub Environment supplies the per-env secrets (DATABASE_URL, etc.).
    # Names MUST match the environments in repo Settings exactly (case-sensitive):
    # `Production` (main branch) / `Development` (any other branch).
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development (dev branch)' }}
    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/ambitiousyou-backend
      # Supabase can resolve to IPv6 first; GitHub-hosted runners may not have
      # IPv6 egress. Force Node DNS to prefer IPv4 for pg/drizzle connectivity.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Full graph install so drizzle-kit (a devDependency) is available.
      - name: Install (backend + workspace deps)
        run: pnpm install --frozen-lockfile --filter backend...

      # Surface the REAL connection target + error before migrating — drizzle-kit
      # hides both behind its spinner. Prints host/port/user (password stays
      # masked) and fails fast (10s) with the actual error instead of a ~2-min hang.
      - name: Verify DB connectivity
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_POOLER_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          const raw = process.env.DATABASE_URL ?? '';
          const url = raw.trim();
          if (!url) {
            console.error('DATABASE_URL is empty');
            process.exit(1);
          }
          if (url !== raw) {
            console.log(
              `WARNING: DATABASE_URL has leading/trailing whitespace (len ${raw.length} vs trimmed ${url.length})`,
            );
          }
          let parsed;
          try {
            parsed = new URL(url);
          } catch (err) {
            const message = err instanceof Error ? err.message : String(err);
            console.error(`URL parse error: ${message} (password may contain unescaped special characters)`);
            process.exit(1);
          }
          const host = parsed.hostname;
          const port = parsed.port || '5432';
          const user = decodeURIComponent(parsed.username);
          console.log(
            `Target -> host=${host} port=${port} user=${user} params=${parsed.search || '(none)'}`,
          );
          if (/^db\.[^.]+\.supabase\.co$/i.test(host)) {
            console.error('');
            console.error('ERROR: Direct Supabase host (db.*.supabase.co) is not usable from GitHub Actions.');
            console.error('It resolves to IPv6; hosted runners have no IPv6 egress → ENETUNREACH.');
            console.error('');
            console.error('Fix: set SUPABASE_POOLER_DATABASE_URL to the Session pooler URI');
            console.error('(host *.pooler.supabase.com, port 5432, user postgres.<ref>). See apps/backend/.env.example');
            process.exit(1);
          }
          if (host.includes('pooler.supabase.com') && port === '6543') {
            console.error('');
            console.error('ERROR: Transaction pooler (port 6543) is incompatible with NestJS transactions.');
            console.error('Use Session pooler on port 5432 instead.');
            process.exit(1);
          }
          const ssl = url.includes('supabase.com') ? { rejectUnauthorized: false } : undefined;
          const client = new Client({ connectionString: url, connectionTimeoutMillis: 10_000, ssl });
          client
            .connect()
            .then(() => client.query('select 1'))
            .then(() => {
              console.log('DB connection OK');
              return client.end();
            })
            .then(() => process.exit(0))
            .catch((err) => {
              const message = err instanceof Error ? err.message : String(err);
              console.error(`DB connection FAILED: ${message}`);
              if (/tenant\/user.*not found/i.test(message)) {
                console.error('Hint: copy the Session pooler URI verbatim (correct project + aws-0 vs aws-1 region).');
              }
              if (/ENETUNREACH|(?:^|[:\s])(?:2406|2600):/i.test(message)) {
                console.error('Hint: IPv6 unreachable — use Session pooler (pooler.supabase.com:5432), not db.*.supabase.co.');
              }
              process.exit(1);
            });
          NODE

      # Apply migrations to the target DB BEFORE swapping containers.
      # Keep schema changes expand/contract-safe (old container keeps serving).
      - name: Run DB migrations
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_POOLER_DATABASE_URL || secrets.DATABASE_URL }}
        run: pnpm exec drizzle-kit migrate

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.DEPLOY_ENV }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ship the latest deploy.sh to the VPS, so it's always present and in sync
      # with the repo — no manual copy step. Lands at /opt/ambitiousyou/deploy.sh
      # (strip_components drops the infra/ prefix). Needs /opt/ambitiousyou to
      # exist + be writable by VPS_USER (created by setup-vps.sh); if this step
      # fails with "no such directory", CI is hitting a wrong/unprovisioned host.
      - name: Ship deploy.sh to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: infra/deploy.sh
          target: /opt/ambitiousyou
          strip_components: 1

      # Zero-downtime blue-green swap on the VPS (see infra/deploy.sh). Prints
      # hostname/whoami/ls first, so a wrong-host VPS_HOST is obvious in the log.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Connected to host=$(hostname) as user=$(whoami)"
            ls -la /opt/ambitiousyou/ || true
            chmod +x /opt/ambitiousyou/deploy.sh
            bash /opt/ambitiousyou/deploy.sh ${{ env.DEPLOY_ENV }} ${{ env.IMAGE }}:${{ github.sha }}
