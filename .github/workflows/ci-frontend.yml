name: ci-frontend

# Lint, unit/component tests, and production build for the Next.js frontend.
# Deploys are orchestrated by deploy-frontend-and-backend-to-vercel.yml (not Vercel
# Git auto-deploy). Pair with branch protection on main/dev:
#
#   Settings → Branches → Add rule for `main` and `dev`
#   → Require status checks → select jobs from ci-frontend and deploy workflows
on:
  pull_request:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: [main, dev]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frontend + workspace deps)
        run: pnpm install --frozen-lockfile --filter frontend...

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Run unit and component tests
        run: pnpm --filter frontend test

      # Next.js 16.3 writes a Turbopack FileSystem build cache to .next/cache.
      # CI starts from a clean checkout, so without restoring it the cache is
      # written and thrown away every run.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/frontend/.next/cache
          key: nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/frontend/src/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Production build
        run: pnpm --filter frontend build

      - name: Lighthouse CI (SEO & performance budgets)
        working-directory: apps/frontend
        run: |
          npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
